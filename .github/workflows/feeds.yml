name: Refresh Medium and YouTube lists

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Medium
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@gowthamjaganthan"
          max_post_count: 5
          comment_tag_name: BLOG-POST-LIST
          commit_message: "chore: refresh Medium posts"
      - name: YouTube
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCKprTPbRyuW-1GTJUkqdcGg"
          max_post_count: 4
          comment_tag_name: YOUTUBE-LIST
          commit_message: "chore: refresh YouTube videos"
