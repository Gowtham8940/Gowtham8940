<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Gowtham J, senior React Native developer and mobile team lead">
<defs>
  <clipPath id="card"><rect width="1000" height="340" rx="22"/></clipPath>
  <clipPath id="screen"><rect x="842" y="70" width="116" height="212" rx="14"/></clipPath>
  <style>
    .f{font-family:Geist,Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .phone{animation:float 6s ease-in-out infinite}
    .dot{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
    .feed{animation:feed 9s cubic-bezier(.7,0,.3,1) infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.55}}
    @keyframes feed{0%,28%{transform:translateY(0)}33%,61%{transform:translateY(-70px)}66%,94%{transform:translateY(-140px)}100%{transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<g clip-path="url(#card)">
  <rect width="1000" height="340" fill="#0E1210"/>
  <circle cx="900" cy="176" r="232" fill="#4CC38A"/>

  <g class="phone">
    <rect x="834" y="60" width="132" height="232" rx="22" fill="#4CC38A" stroke="#0E1210" stroke-width="3"/>
    <g clip-path="url(#screen)">
      <rect x="842" y="70" width="116" height="212" fill="#0E1210" fill-opacity=".1"/>
      <g class="feed">
        <rect x="852" y="86" width="96" height="40" rx="8" fill="#0E1210" fill-opacity=".9"/><rect x="852" y="132" width="64" height="6" rx="3" fill="#0E1210" fill-opacity=".55"/><rect x="852" y="142" width="40" height="6" rx="3" fill="#0E1210" fill-opacity=".3"/><rect x="852" y="156" width="96" height="40" rx="8" fill="#0E1210" fill-opacity=".9"/><rect x="852" y="202" width="80" height="6" rx="3" fill="#0E1210" fill-opacity=".55"/><rect x="852" y="212" width="30" height="6" rx="3" fill="#0E1210" fill-opacity=".3"/><rect x="852" y="226" width="96" height="40" rx="8" fill="#0E1210" fill-opacity=".9"/><rect x="852" y="272" width="52" height="6" rx="3" fill="#0E1210" fill-opacity=".55"/><rect x="852" y="282" width="58" height="6" rx="3" fill="#0E1210" fill-opacity=".3"/><rect x="852" y="296" width="96" height="40" rx="8" fill="#0E1210" fill-opacity=".9"/><rect x="852" y="342" width="64" height="6" rx="3" fill="#0E1210" fill-opacity=".55"/><rect x="852" y="352" width="40" height="6" rx="3" fill="#0E1210" fill-opacity=".3"/>
      </g>
    </g>
    <circle cx="944" cy="82" r="5" fill="#F5C542" class="dot"/>
  </g>
  <text x="900" y="322" text-anchor="middle" class="m" font-size="12" fill="#0E1210" fill-opacity=".8">offline-first · 60 fps</text>

  <g class="in">
    <circle cx="62" cy="62" r="5" fill="#F5C542" class="dot"/>
    <text x="76" y="67" class="f" font-size="14" font-weight="500" fill="#9BA39E">Open to senior React Native and mobile lead roles</text>
  </g>
  <text x="52" y="150" class="f in in2" font-size="80" font-weight="600" letter-spacing="-3.6" fill="#ECEFEA">Gowtham J</text>
  <text x="56" y="192" class="f in in3" font-size="22" font-weight="600" letter-spacing="-0.4" fill="#ECEFEA">Senior React Native developer · mobile team lead</text>
  <text x="56" y="220" class="f in in3" font-size="16" fill="#9BA39E">Offline-first learning apps, native modules in Swift and Kotlin, AI agents.</text>
  <line x1="56" y1="246" x2="628" y2="246" stroke="#26302B" stroke-width="1"/>
  <g class="in in4"><text x="56" y="284" class="f" font-size="28" font-weight="600" letter-spacing="-0.8" fill="#ECEFEA">4+</text><text x="56" y="306" class="f" font-size="13" font-weight="500" fill="#9BA39E">years shipping</text><text x="204" y="284" class="f" font-size="28" font-weight="600" letter-spacing="-0.8" fill="#ECEFEA">800K+</text><text x="204" y="306" class="f" font-size="13" font-weight="500" fill="#9BA39E">students reached</text><text x="352" y="284" class="f" font-size="28" font-weight="600" letter-spacing="-0.8" fill="#ECEFEA">9</text><text x="352" y="306" class="f" font-size="13" font-weight="500" fill="#9BA39E">apps in the stores</text><text x="500" y="284" class="f" font-size="28" font-weight="600" letter-spacing="-0.8" fill="#ECEFEA">12</text><text x="500" y="306" class="f" font-size="13" font-weight="500" fill="#9BA39E">AI agents in Aira</text></g>
</g>
<rect x=".5" y=".5" width="999" height="339" rx="21.5" fill="none" stroke="#26302B"/>
</svg>
