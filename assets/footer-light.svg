<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Building mobile apps that scale. Get in touch.">
<defs><clipPath id="c"><rect width="1000" height="150" rx="22"/></clipPath>
<style>.f{font-family:Geist,Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif} .dot{transform-box:fill-box;transform-origin:center;animation:p 2.4s ease-in-out infinite} @keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(.6);opacity:.55}} @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<g clip-path="url(#c)">
  <rect width="1000" height="150" fill="#1F6B4A"/>
  <text x="56" y="76" class="f" font-size="40" font-weight="600" letter-spacing="-1.6" fill="#FFFFFF">Building mobile apps that scale.</text>
  <circle cx="62" cy="110" r="5" fill="#F5C542" class="dot"/>
  <text x="76" y="115" class="f" font-size="15" font-weight="500" fill="#FFFFFF" fill-opacity=".85">Based in India, open to relocation. Replies within a day.</text>
  <rect x="790" y="51" width="154" height="48" rx="24" fill="#FFFFFF"/>
  <text x="867" y="81" text-anchor="middle" class="f" font-size="16" font-weight="600" fill="#1F6B4A">Get in touch →</text>
</g>
</svg>
